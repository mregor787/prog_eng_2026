services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - delivery-network
    restart: unless-stopped

  mongodb:
    image: mongo:7-jammy
    container_name: delivery-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: delivery_mongo
      MONGO_INITDB_ROOT_PASSWORD: delivery_mongo_password
      MONGO_INITDB_DATABASE: delivery_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "delivery_mongo", "--password", "delivery_mongo_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-user-service
    command: ["/app/delivery-service-user", "--config", "/app/configs/static_config_user.yaml"]
    ports:
      - "8081:8081"
    volumes:
      - ./configs/static_config_user.yaml:/app/configs/static_config_user.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://delivery_user:delivery_password@postgres:5432/delivery_db
      MONGO_URI: mongodb://delivery_mongo:delivery_mongo_password@mongodb:27017/delivery_db?authSource=admin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  parcel-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-parcel-service
    command: ["/app/delivery-service-parcel", "--config", "/app/configs/static_config_parcel.yaml"]
    ports:
      - "8082:8082"
    volumes:
      - ./configs/static_config_parcel.yaml:/app/configs/static_config_parcel.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://delivery_user:delivery_password@postgres:5432/delivery_db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  delivery-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-delivery-service
    command: ["/app/delivery-service-delivery", "--config", "/app/configs/static_config_delivery.yaml"]
    ports:
      - "8083:8083"
    volumes:
      - ./configs/static_config_delivery.yaml:/app/configs/static_config_delivery.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://delivery_user:delivery_password@postgres:5432/delivery_db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: delivery-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./swagger:/usr/share/nginx/html/swagger:ro
      - ./openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    depends_on:
      - user-service
      - parcel-service
      - delivery-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - delivery-network
    restart: unless-stopped

networks:
  delivery-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: