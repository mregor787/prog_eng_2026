services:
  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-user-service
    command: ["/app/delivery-service-user", "--config", "/app/configs/static_config_user.yaml"]
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./configs/static_config_user.yaml:/app/configs/static_config_user.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  parcel-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-parcel-service
    command: ["/app/delivery-service-parcel", "--config", "/app/configs/static_config_parcel.yaml"]
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
      - ./configs/static_config_parcel.yaml:/app/configs/static_config_parcel.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  delivery-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-delivery-service
    command: ["/app/delivery-service-delivery", "--config", "/app/configs/static_config_delivery.yaml"]
    ports:
      - "8083:8083"
    volumes:
      - ./data:/app/data
      - ./configs/static_config_delivery.yaml:/app/configs/static_config_delivery.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - delivery-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: delivery-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./swagger:/usr/share/nginx/html/swagger:ro
      - ./openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    depends_on:
      - user-service
      - parcel-service
      - delivery-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - delivery-network
    restart: unless-stopped

networks:
  delivery-network:
    driver: bridge
