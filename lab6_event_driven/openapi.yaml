openapi: 3.0.3
info:
  title: Delivery Service API
  version: 1.0.0
  description: REST API for parcel delivery service

servers:
  - url: http://localhost:8080

paths:
  /api/v1/users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '409':
          description: User already exists

  /api/v1/users/{login}:
    get:
      summary: Get user by login
      security:
        - bearerAuth: []
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/v1/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'

  /api/v1/users/search:
    get:
      summary: Search users by name/surname mask
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /api/v1/users/{id}/parcels:
    get:
      summary: Get parcels of a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Parcels retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/v1/parcels:
    post:
      summary: Create a parcel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParcelRequest'
      responses:
        '201':
          description: Parcel created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '401':
          description: Unauthorized

  /api/v1/deliveries:
    post:
      summary: Create a delivery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryRequest'
      responses:
        '201':
          description: Delivery created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401':
          description: Unauthorized

    get:
      summary: Get deliveries by sender or receiver
      security:
        - bearerAuth: []
      parameters:
        - name: sender_id
          in: query
          required: false
          schema:
            type: integer
        - name: receiver_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Deliveries retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '400':
          description: Missing or invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required: [login, email, first_name, last_name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        login:
          type: string
          example: "mregor"
        email:
          type: string
          format: email
          example: "mregor@example.com"
        first_name:
          type: string
          example: "Egor"
        last_name:
          type: string
          example: "Belousov"
        created_at:
          type: string
          format: date-time

    Parcel:
      type: object
      required: [description, weight]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        sender_id:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          example: "A computer mouse"
        weight:
          type: number
          format: double
          example: 100.0
        created_at:
          type: string
          format: date-time

    Delivery:
      type: object
      required: [receiver_id, parcel_id]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        sender_id:
          type: integer
          format: int64
          example: 1
        receiver_id:
          type: integer
          format: int64
          example: 2
        parcel_id:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          example: "CREATED"
        cost:
          type: number
          format: double
          example: 10.0
        created_at:
          type: string
          format: date-time
        
    CreateUserRequest:
      type: object
      required: [login, email, first_name, last_name, password]
      properties:
        login:
          type: string
          example: "mregor"
        email:
          type: string
          format: email
          example: "mregor@example.com"
        first_name:
          type: string
          example: "Egor"
        last_name:
          type: string
          example: "Belousov"
        password:
          type: string
          format: password
          example: "myStrongPass12345"

    CreateParcelRequest:
      type: object
      required: [description, weight]
      properties:
        description:
          type: string
          example: "A computer mouse"
        weight:
          type: number
          format: double
          example: 100.0

    CreateDeliveryRequest:
      type: object
      required: [receiver_id, parcel_id]
      properties:
        receiver_id:
          type: integer
          format: int64
          example: 1
        parcel_id:
          type: integer
          format: int64
          example: 1
    
    AuthToken:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user_id:
          type: integer
          format: int64
          example: 1
        expires_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Error message"